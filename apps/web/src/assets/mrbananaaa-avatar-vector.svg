 <linearGradient id="hair" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#39302D"/><stop offset=".42" stop-color="#171718"/><stop offset=".75" stop-color="#282323"/><stop offset="1" stop-color="#100F10"/></linearGradient>
